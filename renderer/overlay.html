<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; font-family: 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif; -webkit-user-select: none; }
  .stage { height: 84px; display: flex; align-items: center; justify-content: center; }
  /* borde degradado animado */
  .pill {
    position: relative; display: flex; align-items: center; gap: 14px; min-width: 150px; max-width: 360px; padding: 12px 20px 12px 14px;
    border-radius: 999px; color: #f3f4f8; font-size: 13.5px; font-weight: 500;
    background: linear-gradient(rgba(16,17,24,.92), rgba(16,17,24,.92)) padding-box, conic-gradient(from var(--ang, 0deg), #8a6cff, #d36bff, #ff7d9a, #ffc27d, #8a6cff) border-box;
    border: 1.5px solid transparent; backdrop-filter: blur(20px);
    box-shadow: 0 14px 40px -8px rgba(0,0,0,.6), 0 0 36px -8px rgba(166,108,255,.55);
    animation: spin 4s linear infinite, pop .28s cubic-bezier(.2,1.3,.4,1) both;
  }
  @property --ang { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @keyframes spin { to { --ang: 360deg; } }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.92); } }
  .orb { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; background: linear-gradient(135deg,#8a6cff,#ff7d9a); box-shadow: 0 0 18px rgba(200,110,255,.6); }
  .orb svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .bars { display: flex; align-items: center; gap: 3px; height: 28px; }
  .bars i { width: 3px; height: 4px; border-radius: 2px; background: linear-gradient(#ffc27d,#ff7d9a 50%,#a77cff); transition: height .07s linear; }
  .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px; color: #dfe1ea; }
  .label.wrap { white-space: normal; line-height: 1.3; font-size: 12.5px; }
  .dots { display: none; gap: 5px; } .dots i { width: 6px; height: 6px; border-radius: 50%; background: #d36bff; animation: b 1s infinite; } .dots i:nth-child(2){animation-delay:.15s} .dots i:nth-child(3){animation-delay:.3s}
  @keyframes b { 0%,80%,100% { transform: scale(.5); opacity: .4 } 40% { transform: scale(1); opacity: 1 } }
  .ico { display: none; } .ico svg { width: 18px; height: 18px; stroke-width: 3; }
  body[data-s=processing] .bars, body[data-s=done] .bars, body[data-s=error] .bars, body[data-s=cancelled] .bars { display: none; }
  body[data-s=processing] .dots { display: flex; }
  body[data-s=listening] .orb { animation: breathe 1.4s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.12); box-shadow: 0 0 28px rgba(255,125,154,.8); } }
  body[data-s=done] .orb { background: linear-gradient(135deg,#2fd08a,#7be0b0); }
  body[data-s=error] .orb { background: linear-gradient(135deg,#ff4d6a,#ff8a6a); }
  body[data-s=cancelled] .orb { background: #4a4d5c; box-shadow: none; }
  kbd { font: 600 10.5px 'Segoe UI'; padding: 3px 7px; border-radius: 6px; border: 1px solid rgba(255,255,255,.18); color: #aeb2c2; display: none; }
  body[data-s=listening] kbd { display: inline-block; }
</style>
</head>
<body data-s="idle">
  <div class="stage"><div class="pill" id="pill">
    <div class="orb" id="orb"></div>
    <div class="bars" id="bars"></div><div class="dots"><i></i><i></i><i></i></div>
    <span class="label" id="label"></span>
    <kbd>Esc</kbd>
  </div></div>
<script src="overlay.js"></script>
</body>
</html>
